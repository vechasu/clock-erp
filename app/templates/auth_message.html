{% extends "auth_base.html" %}
{% block title %}{{ title }} — Vechasu ERP{% endblock %}
{% block auth_content %}
<section class="auth-card" aria-labelledby="message-title">
    <header class="auth-card-header">
        <h1 id="message-title">{{ title }}</h1>
        <p>{{ message }}</p>
    </header>
    <div class="auth-actions"><a class="auth-submit auth-submit-link" href="{{ action_url }}">{{ action_label }}</a></div>
</section>
{% endblock %}

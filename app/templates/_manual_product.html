<dialog id="manual-product-dialog" aria-labelledby="manual-product-heading" style="width:min(560px,calc(100vw - 32px));max-height:90vh;overflow:auto;border:1px solid #dce3eb;border-radius:16px;padding:24px">
    <h2 id="manual-product-heading">Создать самостоятельно</h2>
    <form id="manual-product-form" class="erp-form" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% for name, label in [('name', 'Название'), ('brand', 'Бренд'), ('category', 'Категория'), ('model', 'Модель'), ('article', 'Артикул / SKU'), ('cell', 'Ячейка')] %}
        <label style="display:block;margin:12px 0">{{ label }}{% if name == 'name' %} *{% endif %}<input class="control" style="display:block;width:100%;box-sizing:border-box" name="{{ name }}" {% if name == 'name' %}required{% endif %}></label>
        {% endfor %}
        <label style="display:block;margin:12px 0">Цена<input class="control" name="price" type="number" min="0" step="0.01"></label>
        <label style="display:block;margin:12px 0">Фото<input name="product_image" type="file" accept="image/jpeg,image/png,image/webp"></label>
        <p>Карточка создаётся без Bitrix ID. Остаток изменится только после проведения поставки.</p>
        <p id="manual-product-error" role="alert" hidden></p>
        <div class="actions"><button class="button" id="cancel-manual-product" type="button">Отмена</button> <button class="button primary" type="submit">Создать товар</button></div>
    </form>
</dialog>
<script defer src="{{ url_for('static', filename='js/manual-product.js') }}"></script>

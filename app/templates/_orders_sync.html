<section class="orders-sync" data-orders-sync data-csrf="{{ csrf_token() }}" aria-label="Синхронизация заказов">
    <header><strong>Синхронизация заказов</strong><button class="button button-primary" type="button" data-sync-source="all">↻ Обновить всё</button><button class="button button-secondary" type="button" data-sync-details aria-label="Диагностика и период" aria-expanded="false">⋯</button></header>
    {% for key,label in [('tictactoy','TicTacToy'),('wildberries','Wildberries')] %}
    <div class="orders-sync-row" data-sync-row="{{ key }}" data-state="attention">
        <span class="sync-dot" aria-hidden="true"></span><span>{{ label }}</span><button type="button" class="sync-state-label" data-sync-state data-sync-details aria-label="Диагностика {{ label }}">Проверяем…</button><time data-orders-sync-time>—</time><button class="button button-secondary" type="button" data-sync-source="{{ key }}" aria-label="Обновить {{ label }}">↻</button>
    </div>
    {% endfor %}
    <footer>Последнее обновление: <span data-sync-latest>—</span></footer>
    <div class="orders-sync-details" data-sync-diagnostics hidden>
        <label>Период <select class="field" name="period" form="ordersFilters" aria-label="Период" data-auto-submit-filter>{% for value,label in [('all','Всё время'),('today','Сегодня'),('7d','7 дней'),('30d','30 дней')] %}<option value="{{ value }}"{% if request.args.get('period','all') == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
        <p data-ttt-diagnostic role="status"></p>
        {% with unified_orders_sync=true %}{% include "_wb_recovery.html" %}{% endwith %}
    </div>
</section>
<script defer src="{{ url_for('static', filename='js/orders-sync.js', v='orders-reference-v1') }}"></script>

name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.10 safety checks
    runs-on: ubuntu-latest
    # The complete Python suite includes real headless-browser regressions and
    # now exceeds ten minutes on shared runners while completing locally.
    timeout-minutes: 20
    env:
      CI: "true"
      FLASK_ENV: testing
      BITRIX_LOGIN: ""
      BITRIX_PASSWORD: ""
      BITRIX_EXCHANGE_URL: ""
      BITRIX_CATALOG_URL: ""
      BITRIX_CATALOG_TOKEN: ""
      MOYSKLAD_TOKEN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Verify isolated environment
        run: |
          test ! -f .env
          test -z "$BITRIX_LOGIN"
          test -z "$BITRIX_PASSWORD"
          test -z "$BITRIX_EXCHANGE_URL"
          test -z "$BITRIX_CATALOG_URL"
          test -z "$BITRIX_CATALOG_TOKEN"
          test -z "$MOYSKLAD_TOKEN"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      # Tests use temporary databases and fake/mock clients. No integration
      # scripts, production secrets, SSH, deploy, Bitrix writes or MoySklad
      # writes are invoked by this workflow.
      - name: Check production SQLite SQL compatibility
        run: python scripts/migration_preflight.py static-check --source-root .

      - name: Reject untracked runtime DDL
        run: python scripts/check_runtime_ddl.py

      - name: Validate deploy shell
        run: bash -n scripts/deploy.sh

      - name: Run unit tests
        run: python scripts/run_backend_tests.py --start-directory tests

      - name: Compile Python sources
        run: python -m compileall app scripts tests

  frontend:
    name: Frontend safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install preview server dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../requirements.txt
          python -m pip check

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck application
        run: pnpm run typecheck

      - name: Typecheck unit tests
        run: pnpm run typecheck:unit

      - name: Typecheck Playwright E2E
        run: pnpm run typecheck:e2e

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Production build
        run: pnpm run build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Product lifecycle Playwright regression
        run: pnpm run test:e2e:products

      - name: Playwright/Axe accessibility gate
        env:
          CI: "true"
          ERP_TEST_MODE: "1"
          ERP_AUTH_ENABLED: "0"
          BITRIX_LOGIN: ""
          BITRIX_PASSWORD: ""
          BITRIX_EXCHANGE_URL: ""
          BITRIX_CATALOG_URL: ""
          BITRIX_CATALOG_TOKEN: ""
          MOYSKLAD_TOKEN: ""
        run: pnpm run test:a11y

name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      css_only: ${{ steps.classify.outputs.css_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect CSS-only change
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          css_only=false
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -t changed_files < <(git diff --name-only "origin/$BASE_REF...HEAD")
          elif [[ "$EVENT_NAME" == "push" ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            mapfile -t changed_files < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          else
            # New branches and manual runs take the safe full-check path because
            # they do not provide a trustworthy comparison range.
            changed_files=()
          fi

          if (( ${#changed_files[@]} > 0 )); then
            css_only=true
            for file in "${changed_files[@]}"; do
              [[ "$file" == *.css ]] || css_only=false
            done
          fi

          printf 'Changed files:\n'
          printf ' - %s\n' "${changed_files[@]}"
          printf 'css_only=%s\n' "$css_only" | tee -a "$GITHUB_OUTPUT"

  tests:
    name: Python 3.10 safety checks
    needs: changes
    if: needs.changes.outputs.css_only != 'true'
    runs-on: ubuntu-latest
    # The complete Python suite includes real headless-browser regressions and
    # now exceeds ten minutes on shared runners while completing locally.
    timeout-minutes: 30
    env:
      CI: "true"
      FLASK_ENV: testing
      BITRIX_LOGIN: ""
      BITRIX_PASSWORD: ""
      BITRIX_EXCHANGE_URL: ""
      BITRIX_CATALOG_URL: ""
      BITRIX_CATALOG_TOKEN: ""
      MOYSKLAD_TOKEN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Verify isolated environment
        run: |
          test ! -f .env
          test -z "$BITRIX_LOGIN"
          test -z "$BITRIX_PASSWORD"
          test -z "$BITRIX_EXCHANGE_URL"
          test -z "$BITRIX_CATALOG_URL"
          test -z "$BITRIX_CATALOG_TOKEN"
          test -z "$MOYSKLAD_TOKEN"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      # Tests use temporary databases and fake/mock clients. No integration
      # scripts, production secrets, SSH, deploy, Bitrix writes or MoySklad
      # writes are invoked by this workflow.
      - name: Check production SQLite SQL compatibility
        run: python scripts/migration_preflight.py static-check --source-root .

      - name: Reject untracked runtime DDL
        run: python scripts/check_runtime_ddl.py

      - name: Validate deploy shell
        run: bash -n scripts/deploy.sh

      - name: Run unit tests
        run: python scripts/run_backend_tests.py --start-directory tests

      - name: Compile Python sources
        run: python -m compileall app scripts tests

  frontend:
    name: Frontend safety checks
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install preview server dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../requirements.txt
          python -m pip check

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck application
        if: needs.changes.outputs.css_only != 'true'
        run: pnpm run typecheck

      - name: Typecheck unit tests
        if: needs.changes.outputs.css_only != 'true'
        run: pnpm run typecheck:unit

      - name: Typecheck Playwright E2E
        if: needs.changes.outputs.css_only != 'true'
        run: pnpm run typecheck:e2e

      - name: Lint
        if: needs.changes.outputs.css_only != 'true'
        run: pnpm run lint

      - name: Unit tests
        if: needs.changes.outputs.css_only != 'true'
        run: pnpm run test

      - name: Production build
        run: pnpm run build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Orders UX Playwright regression
        if: needs.changes.outputs.css_only != 'true'
        run: pnpm exec playwright test --config playwright.orders.config.ts

      - name: Orders navigation concurrency regression
        if: needs.changes.outputs.css_only != 'true'
        env:
          ERP_TEST_MODE: "1"
          ERP_AUTH_ENABLED: "0"
        run: pnpm exec playwright test e2e/orders-navigation.spec.ts --project desktop-1440

      - name: Local supplies Playwright regression
        if: needs.changes.outputs.css_only != 'true'
        run: pnpm exec playwright test --config playwright.supplies.config.ts

      - name: Product lifecycle Playwright regression
        if: needs.changes.outputs.css_only != 'true'
        run: pnpm run test:e2e:products

      - name: Repair guided workflow Playwright regression
        if: needs.changes.outputs.css_only != 'true'
        run: pnpm exec playwright test --config playwright.repairs.config.ts

      - name: SMS responsive Playwright smoke
        if: needs.changes.outputs.css_only != 'true'
        env:
          ERP_TEST_MODE: "1"
          ERP_AUTH_ENABLED: "0"
          SMSBLISS_LOGIN: ""
          SMSBLISS_PASSWORD: ""
        run: pnpm exec playwright test e2e/sms.spec.ts --project=desktop-1440

      - name: Write-off desktop and mobile workflow
        if: needs.changes.outputs.css_only != 'true'
        env:
          ERP_TEST_MODE: "1"
          ERP_AUTH_ENABLED: "0"
        run: pnpm exec playwright test e2e/writeoffs.spec.ts --project=desktop-1440 --project=mobile-390

      - name: Playwright/Axe accessibility gate
        env:
          CI: "true"
          ERP_TEST_MODE: "1"
          ERP_AUTH_ENABLED: "0"
          BITRIX_LOGIN: ""
          BITRIX_PASSWORD: ""
          BITRIX_EXCHANGE_URL: ""
          BITRIX_CATALOG_URL: ""
          BITRIX_CATALOG_TOKEN: ""
          MOYSKLAD_TOKEN: ""
        run: pnpm run test:a11y
